<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart To-Do List</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body>

    <main class="app">


        <section class="header">

            <h1>My To-Do List</h1>

            <p>Organize your day and get things done 🚀</p>

        </section>


    

        <section class="add-task">

            <input
                type="text"
                id="taskInput"
                placeholder="Enter a new task..."
            >

            <button id="addTaskBtn">
                Add Task
            </button>

        </section>


        

        <section class="task-container">


        

            <div class="task-column">

                <div class="task-header">

                    <h2>Pending Tasks</h2>

                    <span id="pendingCount">
                        0 pending
                    </span>

                </div>


                <div id="pendingList" class="task-list">

                    <div class="empty-message">
                        🎉 No pending tasks. Enjoy your day!
                    </div>

                </div>

            </div>


            

            <div class="task-column completed-column">

                <div class="task-header">

                    <h2>Completed Tasks</h2>

                    <span id="completedCount">
                        0 completed
                    </span>

                </div>


                <div id="completedList" class="task-list">

                    <div class="empty-message">
                        No completed tasks yet.
                    </div>

                </div>

            </div>


        </section>


    </main>


    <script src="script.js"></script>

</body>

</html>
